services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RELAY_DATABASE_URL: "postgresql+psycopg://relay:relay@postgres:5432/relay"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
