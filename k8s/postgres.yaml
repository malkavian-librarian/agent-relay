apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: agent-relay-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-relay-postgres
  template:
    metadata:
      labels:
        app: agent-relay-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: relay
            - name: POSTGRES_PASSWORD
              value: relay
            - name: POSTGRES_DB
              value: relay
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "relay", "-d", "relay"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "relay", "-d", "relay"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: agent-relay-postgres
spec:
  selector:
    app: agent-relay-postgres
  ports:
    - port: 5432
      targetPort: 5432
